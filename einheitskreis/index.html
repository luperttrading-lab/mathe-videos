<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einheitskreis</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einheitskreis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Farben wie die Kopfrechnen-App und die Videos: Papiergrund, Tinte; Sinus rot, Kosinus blau, Winkel orange (wie das Erklärvideo), Tangens grün */
:root {
  --grund: #f6f1e7; --karte: #ffffff; --ink: #2b2d42; --grau: #6f7380; --hell: #e6dfd2;
  --sin: #e63946; --cos: #3a86ff; --tan: #0f766e; --bogen: #ff9f1c; --rand: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0; margin: 0; background: var(--grund); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background-image: radial-gradient(rgba(120,100,70,.13) 1.2px, transparent 1.3px); background-size: 24px 24px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.seite {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: max(env(safe-area-inset-top), 12px) max(env(safe-area-inset-right), var(--rand))
           max(env(safe-area-inset-bottom), 12px) max(env(safe-area-inset-left), var(--rand));
}

/* ---------- Start ---------- */
#start { padding: 0; }
#startbild { position: absolute; inset: 0; width: 100%; height: 100%; }
.starttext {
  position: absolute; left: max(env(safe-area-inset-left), 20px); right: max(env(safe-area-inset-right), 20px);
  bottom: max(env(safe-area-inset-bottom), 20px); display: flex; flex-direction: column; gap: 14px;
}
.titel { align-self: flex-end; text-align: right; }
.titel h1 { margin: 0; font-size: clamp(34px, 10.5vw, 46px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
.titel p { margin: 8px 0 0; font-size: 17px; color: var(--grau); font-weight: 600; line-height: 1.3; }
.titel p b.s { color: var(--sin); } .titel p b.c { color: var(--cos); }
.los { padding: 17px; border-radius: 18px; font-weight: 800; font-size: 20px; background: var(--tan); color: #fff;
  box-shadow: 0 4px 0 #0a524c; }
.los:active { transform: translateY(2px); box-shadow: 0 2px 0 #0a524c; }

/* ---------- Werkzeug ---------- */
#werkzeug { gap: 8px; }
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.kopf .name { display: flex; flex-direction: column; line-height: 1.1; }
.kopf h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
#version { align-self: flex-start; font-size: 11px; color: var(--grau); text-decoration: underline dotted; text-underline-offset: 2px;
  padding: 2px 0; }
.chips { display: flex; gap: 6px; }
.chip { padding: 7px 11px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--karte);
  border: 1.5px solid var(--hell); color: var(--grau); white-space: nowrap; }
.chip[aria-pressed="true"] { background: #e6f2f0; border-color: var(--tan); color: var(--tan); }
#kreisfeld { position: relative; flex: 1 1 auto; min-height: 0; }
#kreis { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.ecke { position: absolute; font-size: 13px; font-weight: 700; pointer-events: none; line-height: 1.25; }
#tanwert { left: 0; top: 0; color: var(--tan); }
#hinweis { left: 0; bottom: 0; color: var(--grau); font-weight: 600; transition: opacity .6s; }
#kurven { display: block; width: 100%; height: clamp(92px, 15vh, 150px); flex: none; touch-action: none; }

.regler { display: flex; flex-direction: column; gap: 2px; flex: none; }
.zeile { display: grid; grid-template-columns: 42px 1fr 86px; align-items: center; gap: 8px; height: 42px; }
.zeile label { font-weight: 800; font-size: 17px; }
.zeile .wert { text-align: right; line-height: 1.1; white-space: nowrap; }
.wert .gross { display: block; font-size: 18px; font-weight: 800; }
.wert .klein { display: block; font-size: 12px; color: var(--grau); font-weight: 600; min-height: 13px; }
#z-sin label, #z-sin .gross { color: var(--sin); }
#z-cos label, #z-cos .gross { color: var(--cos); }
#z-win label { color: #c96f00; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 42px; margin: 0; background: transparent;
  touch-action: pan-y; --f: var(--ink); --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--f) var(--p), var(--hell) var(--p)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--hell); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--f); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
  background: #fff; border: 3px solid var(--f); box-shadow: 0 2px 5px rgba(0,0,0,.2); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--f); }
#r-sin { --f: var(--sin); } #r-cos { --f: var(--cos); } #r-win { --f: var(--bogen); }
/* sin und cos: Füllung von der Mitte (0) aus, damit das Vorzeichen sichtbar ist */
#r-sin::-webkit-slider-runnable-track, #r-cos::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, var(--hell) var(--a), var(--f) var(--a), var(--f) var(--b), var(--hell) var(--b)); }

/* ---------- Banner (Update, Hinweise) – Skill app-update-iphone ---------- */
.update {
  position: fixed; left: 12px; right: 12px; top: max(env(safe-area-inset-top), 12px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #34c759; color: #06240e; padding: 12px 14px; border-radius: 14px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.update.an { opacity: 1; pointer-events: auto; }
.update[hidden] { display: none; }
.update.info { background: #2d2d33; color: #f2f2f7; font-weight: 500; }
.update.unten { top: auto; bottom: max(env(safe-area-inset-bottom), 12px); }
.update .btn { padding: 8px 14px; border-radius: 10px; font-size: 15px; font-weight: 700; background: #06240e; color: #fff; }
</style>
</head>
<body>
<div class="update" id="update" hidden><span id="update-text"></span><button class="btn" id="update-go">Jetzt laden</button></div>

<!-- Start -->
<section id="start" class="seite">
  <canvas id="startbild"></canvas>
  <div id="sat" style="position:absolute;top:0;width:0;height:env(safe-area-inset-top)"></div>
  <div class="starttext">
    <div class="titel">
      <h1>Einheitskreis</h1>
      <p><b class="s">Sinus</b> und <b class="c">Kosinus</b><br>zum Anfassen</p>
    </div>
    <button class="los" id="los">Los</button>
  </div>
</section>

<!-- Werkzeug -->
<section id="werkzeug" class="seite" hidden>
  <div class="kopf">
    <div class="name"><h1>Einheitskreis</h1><button id="version"></button></div>
    <div class="chips">
      <button class="chip" id="einrasten" aria-pressed="true">Einrasten</button>
      <button class="chip" id="tan" aria-pressed="false">tan</button>
    </div>
  </div>
  <div id="kreisfeld">
    <canvas id="kreis" aria-label="Einheitskreis, Punkt P ziehen"></canvas>
    <div class="ecke" id="tanwert" hidden></div>
    <div class="ecke" id="hinweis">P ziehen oder Regler schieben</div>
  </div>
  <canvas id="kurven" aria-label="Sinus- und Kosinuskurve"></canvas>
  <div class="regler">
    <div class="zeile" id="z-win"><label for="r-win">θ</label>
      <input type="range" id="r-win" min="0" max="360" step="0.1" value="30">
      <div class="wert"><span class="gross" id="w-win"></span><span class="klein" id="w-rad"></span></div></div>
    <div class="zeile" id="z-sin"><label for="r-sin">sin</label>
      <input type="range" id="r-sin" min="-1" max="1" step="0.001" value="0.5">
      <div class="wert"><span class="gross" id="w-sin"></span><span class="klein" id="w-sin2"></span></div></div>
    <div class="zeile" id="z-cos"><label for="r-cos">cos</label>
      <input type="range" id="r-cos" min="-1" max="1" step="0.001" value="0.866">
      <div class="wert"><span class="gross" id="w-cos"></span><span class="klein" id="w-cos2"></span></div></div>
  </div>
</section>

<script src="kreis.js"></script>
<script>
const APP_VERSION = '0.2';          // bei JEDER Änderung hochzählen
const $ = s => document.querySelector(s);
const EK = window.Einheitskreis;

/* ---------- Zustand ---------- */
const SPEICHER = 'einheitskreis.stand';
const stand = { grad: 30, einrasten: true, tan: false };
try { Object.assign(stand, JSON.parse(localStorage.getItem(SPEICHER) || '{}')); } catch (_) {}
function speichereAlles() { try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (_) {} }
// Welche Hälfte gilt, wenn ein Regler den Punkt nicht eindeutig festlegt:
// seiteC = Vorzeichen des Kosinus (rechts/links), seiteS = Vorzeichen des Sinus (oben/unten).
let seiteC = 1, seiteS = 1;
let geist = null, geistTimer = null;

/* ---------- Einrasten ---------- */
const BESONDERE = [];
for (let g = 0; g <= 360; g += 15) if (g % 30 === 0 || g % 45 === 0) BESONDERE.push(g);
const BES_WERTE = [0, .5, Math.SQRT2 / 2, Math.sqrt(3) / 2, 1].flatMap(v => v ? [v, -v] : [0]);
function rasteGrad(g, tol) {
  if (!stand.einrasten) return g;
  for (const b of BESONDERE) if (Math.abs(g - b) <= tol) return b;
  return g;
}
function rasteWert(v, tol = .02) {
  if (!stand.einrasten) return v;
  for (const b of BES_WERTE) if (Math.abs(v - b) <= tol) return b;
  return v;
}

function setzeGrad(g, { roh = false } = {}) {
  stand.grad = roh ? g : EK.normiere(g);
  const w = EK.werte(stand.grad);
  if (Math.abs(w.cos) > 1e-9) seiteC = Math.sign(w.cos);
  if (Math.abs(w.sin) > 1e-9) seiteS = Math.sign(w.sin);
  zeichne();
}
// Aus Sinus (bzw. Kosinus) den Winkel: der andere Wert ist √(1 − Wert²), Vorzeichen von der bisherigen Hälfte
function ausSin(s) {
  const c = seiteC * Math.sqrt(Math.max(0, 1 - s * s));
  return EK.normiere(Math.atan2(s, c) * 180 / Math.PI);
}
function ausCos(c) {
  const s = seiteS * Math.sqrt(Math.max(0, 1 - c * c));
  return EK.normiere(Math.atan2(s, c) * 180 / Math.PI);
}
const gradText = g => (Number.isInteger(g) ? String(g) : EK.komma(g, 1)) + '°';

/* ---------- Leinwände ---------- */
const kreisC = $('#kreis'), kurvenC = $('#kurven');
function passe(c) {
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return { ctx, rahmen: { x: 0, y: 0, w: r.width, h: r.height } };
}
function zeichne() {
  if ($('#werkzeug').hidden) return;
  const g = stand.grad, w = EK.werte(g);
  const k = passe(kreisC);
  EK.zeichneKreis(k.ctx, k.rahmen, g, { tan: stand.tan, geist });
  const u = passe(kurvenC);
  EK.zeichneKurven(u.ctx, u.rahmen, g, { tan: stand.tan });

  // Regler nachziehen
  $('#r-win').value = g;
  $('#r-sin').value = w.sin;
  $('#r-cos').value = w.cos;
  $('#r-win').style.setProperty('--p', (g / 360 * 100) + '%');
  for (const [id, v] of [['#r-sin', w.sin], ['#r-cos', w.cos]]) {
    const p = (v + 1) / 2 * 100;
    $(id).style.setProperty('--a', Math.min(50, p) + '%');
    $(id).style.setProperty('--b', Math.max(50, p) + '%');
  }
  // Werte: exakt an besonderen Winkeln, sonst drei Nachkommastellen
  $('#w-win').textContent = gradText(g);
  $('#w-rad').textContent = w.radText || EK.komma(w.rad, 3) + ' rad';
  const zeige = (gross, klein, text, wert) => {
    $(gross).textContent = text || EK.komma(wert);
    $(klein).textContent = text && !/^−?[01]$/.test(text) ? '≈ ' + EK.komma(wert) : '';
  };
  zeige('#w-sin', '#w-sin2', w.sinText, w.sin);
  zeige('#w-cos', '#w-cos2', w.cosText, w.cos);
  const tw = $('#tanwert');
  tw.hidden = !stand.tan;
  if (stand.tan) {
    tw.textContent = 'tan θ = ' + (w.tanText === 'nicht definiert' || !isFinite(w.tan) ? 'nicht definiert'
      : w.tanText ? w.tanText + (/^−?[01]$/.test(w.tanText) ? '' : ' ≈ ' + EK.komma(w.tan)) : EK.komma(w.tan));
  }
  speichereSpaeter();
}
let speicherTimer = null;
function speichereSpaeter() { clearTimeout(speicherTimer); speicherTimer = setTimeout(speichereAlles, 400); }
new ResizeObserver(zeichne).observe($('#kreisfeld'));
window.addEventListener('resize', zeichne);

/* ---------- Kreis ziehen ---------- */
let zieht = false;
function ausFinger(e) {
  const r = kreisC.getBoundingClientRect();
  const m = EK.kreisMasse({ x: 0, y: 0, w: r.width, h: r.height }, { tan: stand.tan });
  const dx = e.clientX - r.left - m.mx, dy = m.my - (e.clientY - r.top);
  if (Math.hypot(dx, dy) < 4) return;                     // genau im Mittelpunkt: kein Winkel
  setzeGrad(rasteGrad(EK.normiere(Math.atan2(dy, dx) * 180 / Math.PI), 3));
}
kreisC.addEventListener('pointerdown', e => {
  zieht = true; kreisC.setPointerCapture(e.pointerId); ausFinger(e); erstesMal();
});
kreisC.addEventListener('pointermove', e => { if (zieht) ausFinger(e); });
const loslassen = () => { zieht = false; };
kreisC.addEventListener('pointerup', loslassen);
kreisC.addEventListener('pointercancel', loslassen);

/* ---------- Am Kurvenbild ziehen: Winkel entlang der x-Achse ---------- */
let ziehtKurve = false;
function ausKurve(e) {
  const r = kurvenC.getBoundingClientRect();
  const m = EK.kurvenMasse({ x: 0, y: 0, w: r.width, h: r.height });
  const g = Math.max(0, Math.min(360, (e.clientX - r.left - m.links) / (m.rechts - m.links) * 360));
  setzeGrad(rasteGrad(g, 3), { roh: true });
}
kurvenC.addEventListener('pointerdown', e => { ziehtKurve = true; kurvenC.setPointerCapture(e.pointerId); ausKurve(e); erstesMal(); });
kurvenC.addEventListener('pointermove', e => { if (ziehtKurve) ausKurve(e); });
kurvenC.addEventListener('pointerup', () => { ziehtKurve = false; });
kurvenC.addEventListener('pointercancel', () => { ziehtKurve = false; });

/* ---------- Regler ---------- */
$('#r-win').addEventListener('input', e => { setzeGrad(rasteGrad(+e.target.value, 2), { roh: true }); erstesMal(); });
function zeigeGeist(welcher) {
  geist = welcher; clearTimeout(geistTimer);
}
function geistWeg() { clearTimeout(geistTimer); geistTimer = setTimeout(() => { geist = null; zeichne(); }, 700); }
let sinErklaert = false;
$('#r-sin').addEventListener('input', e => {
  zeigeGeist('sin'); erstesMal();
  const s = rasteWert(+e.target.value);
  let g = ausSin(s);
  if (stand.einrasten && BES_WERTE.includes(s)) g = rasteGrad(g, .01);
  setzeGrad(g);
  if (!sinErklaert) { sinErklaert = true;
    showInfo('Zu jedem Sinus gibt es zwei Punkte (der blasse ist der zweite). Der Regler bleibt auf deiner Kreishälfte – die Seite wechselst du mit cos.', 7); }   // oben: unten läge es über dem Regler, den man gerade schiebt
});
$('#r-cos').addEventListener('input', e => {
  zeigeGeist('cos'); erstesMal();
  const c = rasteWert(+e.target.value);
  let g = ausCos(c);
  if (stand.einrasten && BES_WERTE.includes(c)) g = rasteGrad(g, .01);
  setzeGrad(g);
});
for (const id of ['#r-sin', '#r-cos']) {
  $(id).addEventListener('change', geistWeg);
  $(id).addEventListener('pointerup', geistWeg);
  $(id).addEventListener('touchend', geistWeg);
}

/* ---------- Schalter ---------- */
function schalter(id, feld) {
  const b = $(id);
  b.setAttribute('aria-pressed', String(stand[feld]));
  b.addEventListener('click', () => { stand[feld] = !stand[feld]; b.setAttribute('aria-pressed', String(stand[feld])); zeichne(); speichereAlles(); });
}
schalter('#einrasten', 'einrasten');
schalter('#tan', 'tan');

let ersterGriff = false;
function erstesMal() { if (!ersterGriff) { ersterGriff = true; $('#hinweis').style.opacity = 0; } }

/* ---------- Startbild: der Punkt kreist und zeichnet Sinus (nach rechts) und Kosinus (nach unten) ---------- */
const startC = $('#startbild');
let startAnim = null;
function startbild(t) {
  const { ctx, rahmen } = passe(startC);
  const { w, h } = rahmen;
  const F = EK.FARBEN;
  const R = Math.min(w * 0.2, h * 0.11);
  const oben = Math.max(12, $('#sat').offsetHeight);
  const cx = Math.max(24, w * 0.06) + R, cy = oben + 30 + R;
  const k = R * 0.42;                                  // Pixel je Bogenmaß-Einheit der Wellen
  const a = (t / 1000) * 1.1;                          // Winkel in rad, gut eine Umdrehung in 6 s
  const x0 = cx + R + 22, y0 = cy + R + 22;            // Beginn der beiden Wellen
  const px = cx + R * Math.cos(a), py = cy - R * Math.sin(a);
  const u = R / 100;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // Achsen am Kreis
  ctx.strokeStyle = 'rgba(43,45,66,.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx - R * 1.2, cy); ctx.lineTo(cx + R * 1.2, cy); ctx.moveTo(cx, cy - R * 1.2); ctx.lineTo(cx, cy + R * 1.2); ctx.stroke();
  // Achsen der Wellen
  ctx.strokeStyle = 'rgba(43,45,66,.18)';
  ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, y0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.strokeStyle = F.ink; ctx.lineWidth = 2.4 * u;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();

  // Wellen: an der Stelle s (Abstand vom Anfang) steht der Wert von vor s/k Bogenmaß
  ctx.lineWidth = 3.2 * u;
  ctx.strokeStyle = F.sin; ctx.beginPath();
  for (let s = 0; x0 + s <= w + 4; s += 2) { const v = Math.sin(a - s / k); s ? ctx.lineTo(x0 + s, cy - R * v) : ctx.moveTo(x0, cy - R * v); }
  ctx.stroke();
  ctx.strokeStyle = F.cos; ctx.beginPath();
  for (let s = 0; y0 + s <= h + 4; s += 2) { const v = Math.cos(a - s / k); s ? ctx.lineTo(cx + R * v, y0 + s) : ctx.moveTo(cx + R * v, y0); }
  ctx.stroke();

  // Verbindungen vom Punkt zu den Wellenköpfen
  ctx.setLineDash([4, 5]); ctx.lineWidth = 1.3; ctx.strokeStyle = 'rgba(43,45,66,.45)';
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x0, py); ctx.moveTo(px, py); ctx.lineTo(px, y0); ctx.stroke();
  ctx.setLineDash([]);
  // Strecken sin und cos im Kreis
  ctx.lineCap = 'butt'; ctx.lineWidth = 5 * u;
  ctx.strokeStyle = F.cos; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke();
  ctx.strokeStyle = F.sin; ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();
  ctx.lineCap = 'round';
  ctx.strokeStyle = F.ink; ctx.lineWidth = 2 * u; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
  const pt = (x, y, r, f) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = f; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); };
  pt(x0, py, 5.5 * u, F.sin);
  pt(px, y0, 5.5 * u, F.cos);
  pt(px, py, 8 * u, F.ink);
  if (!$('#start').hidden) startAnim = requestAnimationFrame(startbild);
}
function zeigeStart() {
  $('#werkzeug').hidden = true; $('#start').hidden = false;
  cancelAnimationFrame(startAnim); startAnim = requestAnimationFrame(startbild);
}
function zeigeWerkzeug() {
  cancelAnimationFrame(startAnim);
  $('#start').hidden = true; $('#werkzeug').hidden = false;
  setzeGrad(stand.grad, { roh: true });
}
$('#los').addEventListener('click', zeigeWerkzeug);
window.addEventListener('hashchange', () => location.hash === '#kreis' ? zeigeWerkzeug() : null);

/* ---------- Update-Mechanismus (Skill app-update-iphone) ---------- */
const updateEl = $('#update');
let ausTimer = null, infoTimer = null, checking = false, announced = null;
function einblenden() { clearTimeout(ausTimer); updateEl.hidden = false; void updateEl.offsetWidth; updateEl.classList.add('an'); }
function ausblenden() { updateEl.classList.remove('an'); clearTimeout(ausTimer); ausTimer = setTimeout(() => { if (!updateEl.classList.contains('an')) updateEl.hidden = true; }, 380); }
function bannerAnKante(ausloeser) {
  if (!ausloeser) { updateEl.classList.remove('unten'); return; }
  const r = ausloeser.getBoundingClientRect();
  updateEl.classList.toggle('unten', r.top + r.height / 2 > window.innerHeight / 2);
}
function showInfo(text, sekunden = 2, ausloeser = null) {
  bannerAnKante(ausloeser);
  updateEl.className = 'update info' + (updateEl.classList.contains('unten') ? ' unten' : '');
  $('#update-text').textContent = text; $('#update-go').hidden = true;
  einblenden(); clearTimeout(infoTimer);
  if (sekunden) infoTimer = setTimeout(() => { if (updateEl.classList.contains('info')) ausblenden(); }, sekunden * 1000);
}
function zeigeBanner(text) {
  bannerAnKante(null); updateEl.className = 'update';
  $('#update-text').textContent = text; $('#update-go').hidden = false; einblenden();
}
updateEl.addEventListener('click', () => { if (updateEl.classList.contains('info')) ausblenden(); });
$('#update-go').addEventListener('click', () => { speichereAlles(); location.reload(); });
async function checkForUpdate(manual = false, ausloeser = null) {
  if (checking) return;
  if (!manual && document.visibilityState !== 'visible') return;
  if (!navigator.onLine) { if (manual) showInfo('Offline – Prüfung nicht möglich', 3, ausloeser); return; }
  checking = true;
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) announceUpdate(m[1], manual);
    else if (manual) showInfo('Version ' + APP_VERSION + ' ist aktuell', 4, ausloeser);
  } catch (_) { if (manual) showInfo('Prüfung fehlgeschlagen', 3, ausloeser); }
  finally { checking = false; }
}
function announceUpdate(v, manual) {
  if (announced === v && !manual) return;
  announced = v; speichereAlles();
  zeigeBanner('Neue Version ' + v + ' ist da');
  if (manual || !(zieht || ziehtKurve)) setTimeout(() => location.reload(), manual ? 1500 : 3000);   // nicht mitten im Ziehen
}
window.addEventListener('pageshow', () => setTimeout(checkForUpdate, 800));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
$('#version').textContent = 'Version ' + APP_VERSION;
$('#version').addEventListener('click', e => checkForUpdate(true, e.currentTarget));
{
  const GESEHEN = 'einheitskreis.gesehen';
  let vorher = null;
  try { vorher = localStorage.getItem(GESEHEN); } catch (_) {}
  if (vorher !== APP_VERSION) {
    try { localStorage.setItem(GESEHEN, APP_VERSION); } catch (_) {}
    if (vorher) setTimeout(() => showInfo('Version ' + APP_VERSION + ' ist geladen', 4), 400);
  }
}
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {} }

location.hash === '#kreis' ? zeigeWerkzeug() : zeigeStart();
window.einheitskreis = { stand, setzeGrad, ausSin, ausCos, rasteGrad, rasteWert };   // für Tests
</script>
